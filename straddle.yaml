# nomad — Nomad Network page-client on spangap.
#
# The "text web" half of Nomad Network: nodes host pages (Micron markup)
# and files on a `nomadnetwork.node` destination; this straddle is the
# client/browser side. Sits on rnsd's byte-array API directly — not on
# LXMF — using rnsdLinkOpen + rnsdLinkRequest. Storage is the API
# (nomad.nav.*, nomad.page.*, nomad.nodes.*, s.nomad.bookmarks.*).
#
# Browser half: settings + the NomadBrowser window (Micron→DOM renderer).
# LCD slice: the on-device Nomad browser program (C++ Micron→LVGL).
schema_version: 1
name: reticulous/nomad
prefix: nomad
version: 0.1.0
firmware: esp-idf
# LCD slice (esp-idf/lcd/) — see lxmf for notes on activator gating.
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
optional_requires:
  # On-device Nomad browser — conditional/spangap-lcd/src/nomad_lcd.cpp,
  # compiled only when spangap-lcd is staged and registered via the
  # when:-gated nomadLcdRegister init: hook below.
  - spangap/spangap-lcd
# Auto-init: folded into the generated spangapInitStraddles() dispatcher. Runs
# in the straddle band; `requires: reticulous/rns` puts rnsd ahead of it, and
# the platform band guarantees the lcd task already exists. The on-device
# launcher tile registers via the when:-gated nomadLcdRegister hook, which only
# runs (and only compiles) when spangap-lcd is staged. The consumer's app_main
# references nomad nowhere.
init:
  - call: nomadInit
  - call: nomadLcdRegister
    when: spangap/spangap-lcd
