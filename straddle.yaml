# nomad — Nomad Network page-client on spangap.
#
# The "text web" half of Nomad Network: nodes host pages (Micron markup)
# and files on a `nomadnetwork.node` destination; this straddle is the
# client/browser side. Sits on rnsd's byte-array API directly — not on
# LXMF — using rnsdLinkOpen + rnsdLinkRequest. Storage is the API
# (nomad.nav.*, nomad.page.*, nomad.nodes.*, s.nomad.bookmarks.*).
#
# Browser half: settings + the NomadBrowser window (Micron→DOM renderer).
# LCD slice: the on-device Nomad browser program (C++ Micron→LVGL).
schema_version: 1
name: reticulous/nomad
prefix: nomad
version: 0.0.0
firmware: esp-idf
# LCD slice (esp-idf/lcd/) — see lxmf for notes on activator gating.
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
# Boot-registered services: the generated trampoline `new`s each class and
# registers it. NomadService (the nomad task) runs in the straddle band in all
# builds; `requires: reticulous/rns` puts rnsd ahead of it. NomadApp is the
# on-device launcher tile — an LcdApp, so its one entry installs the tile
# (LcdApp::onInit) and does its boot wiring (NomadApp::appInit — Settings pane,
# the nomad.url_lcd open-page hook). It is when:-gated on spangap-lcd, so it only
# runs (and only compiles — the class lives under conditional/spangap-lcd/) when
# the lcd straddle is staged; the platform band brings lcd up first. The
# consumer's app_main references nomad nowhere.
services:
  - { class: NomadService, header: nomad.h }
  - { class: NomadApp, header: nomad_app.h, when: spangap/spangap-lcd }

# Browser-side UI registration (parallel to init: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerNomad

# Declarative settings: both surfaces from one block. The bookmark list is a
# collection over the array nomad.cpp publishes from its store (the persistent
# form is a packed string the browser app and CLI read, so the collection binds
# a published view of it); every mutation comes back through the nomad.bm.*
# sentinels, where the hash check lives.
settings:
  - at:
      - { id: reticulum }
      - { id: nomad, label: "Nomad Network", short: "Nomad", order: 7 }
    rows:
      - section: "Nomad Network"
      - caption: "Browse Nomad Network pages (the text web over Reticulum). The browsing itself happens in the Nomad Browser app."
      - slider: { label: "Announce-drift cap", key: "s.nomad.max_nodes", min: 32, max: 2048 }
      - caption: "Heard nodes kept in the drift list; the oldest are evicted past the cap."
      - list:
          label: "Bookmarks"
          key: nomad.bookmarks
          id: id
          item: "{title}"
          subtitle: "{subtitle}"
          empty: "No bookmarks yet. Bookmark a node from the browser window, or add one here."
          cmd: nomad.bm
          add:
            - label: "Add bookmark"
              form:
                title: "Add bookmark"
                submit: "Add"
                fields:
                  - text: { label: "Node", field: url, placeholder: "32 hex characters[:/page/index.mu]" }
                  - text: { label: "Name", field: name }
                  - text: { label: "Note", field: note }
          remove: { confirm: "Remove {title}?" }
          edit:
            - text: { label: "Node", field: url }
            - text: { label: "Name", field: name }
            - text: { label: "Note", field: note }
